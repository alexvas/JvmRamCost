plugins {
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.jdk.get())
    }
}

configurations {
    proguard
}

dependencies {
    proguard 'com.guardsquare:proguard-base:7.8.2'
}

// 
application {
    mainModule = 'jvmram.app.backend.dist'
    mainClass  = 'jvmram.dist.JvmRamCost'
}

dependencies {
    implementation libs.slf4j.api
    runtimeOnly libs.slf4j.simple

    implementation project(':app-backend')
}

// Fat JAR задача
tasks.register('fatJar', Jar) {
    dependsOn jar
    archiveClassifier = 'fat'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'com/google/gson/**'
    exclude 'com/google/common/hash/**'
    exclude 'com/google/common/net/**'
    exclude 'com/google/common/reflect/**'
    exclude 'com/google/common/eventbus/**'
    exclude 'com/google/common/cache/**'
    exclude 'com/google/protobuf/util/**'
    
    // gRPC JNDI resolver (требует java.naming, не нужен)
    exclude 'io/grpc/internal/JndiResourceResolverFactory*'

    // Исключаем module-info.class для корректной работы jdeps/jpackage
    exclude 'module-info.class'
    exclude '**/module-info.class'

    with jar
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}

// ProGuard минификация
tasks.register('proguardMinify', JavaExec) {
    dependsOn fatJar
    group = 'build'
    description = 'Minify JAR using ProGuard'

    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(libs.versions.jdk.get())
    }

    classpath = configurations.proguard

    mainClass = 'proguard.ProGuard'

    def outJar = layout.buildDirectory.file("minified/jvm-ram-cost.jar")
    outputs.file(outJar)

    doFirst {
        def javaHome = javaLauncher.get().metadata.installationPath.asFile.absolutePath
        def outJarFile = outJar.get().asFile
        def rulesFile = file('proguard-rules.pro')

        outJarFile.parentFile.mkdirs()

        // Создаем временный файл с полной конфигурацией
        def tempRulesFile = file("${buildDir}/proguard-temp.pro")
        tempRulesFile.parentFile.mkdirs()
        def content = rulesFile.text + "\n\n" +
                "-injars ${fatJar.archiveFile.get().asFile.absolutePath}\n" +
                "-outjars ${outJarFile.absolutePath}\n"
        ["java.base", "java.logging", "java.management", "jdk.attach", "jdk.unsupported"].forEach {
            content += "-libraryjars ${javaHome}/jmods/${it}.jmod(!**.jar;!module-info.class)\n"
        }

        tempRulesFile.text = content
        args = ['@' + tempRulesFile.absolutePath]
    }
}

// jpackage с fat JAR
tasks.register('jpackageMin', Exec) {
    dependsOn proguardMinify
    group = 'build'
    description = 'Create installable package using jpackage with Proguard minified JAR'

    doFirst {
        def javaHome = System.getProperty('java.home')
        def jpackageExe = new File(javaHome, 'bin/jpackage')
        if (!jpackageExe.exists()) {
            jpackageExe = new File(javaHome, 'bin/jpackage.exe')
            throw new GradleException("jpackage not found at ${jpackageExe.absolutePath}")
        }

        def fatJarFile = proguardMinify.outputs.files.singleFile
        def outputDir = file("${buildDir}/jpackage")
        outputDir.mkdirs()

        def libsDir = file("${buildDir}/minified")

        def modules = [
            "java.base", 
            "java.logging", 
            "java.management.rmi", // для удалённого вызова методов
            "jdk.attach", // для удалённого подключения к другим JVM
            "jdk.management", // для Heap Dump
            "jdk.unsupported", // использование Unsafe API 
        ]

        def javaOptions = [
            '-Xms10m',
            '-Xmx100m',
            '-XX:MaxDirectMemorySize=50m',
            '--enable-native-access=ALL-UNNAMED',
        ]

        commandLine = [
                jpackageExe.absolutePath,
                '--input', libsDir.absolutePath,
                '--main-jar', fatJarFile.name,
                '--main-class', application.mainClass.get(),
                '--description', "The GUI app to measure JVM's RAM consumption",
                '--name', 'jvm-ram-cost',
                '--app-version', libs.versions.jvmram.get(),
                '--vendor', 'Alexander Vasilev',
                '--copyright', '2026 Alexander Vasilev',
                '--type', 'app-image',
                '--dest', outputDir.absolutePath,
                // Explicit modules
                '--add-modules', modules.join(','),
                // JVM options, вшитые в launcher
                '--java-options', javaOptions.join(' ')
        ]
    }
}
